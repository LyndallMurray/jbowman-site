# J BOWMAN — Netlify configuration
#
# A plain static site: no build step, no dependencies, nothing to install.
# Netlify publishes dist/ exactly as it is.

[build]
  publish = "dist"
  # No command. Adding one would make Netlify look for a package.json that
  # does not exist and fail the deploy.

# ---------------------------------------------------------------------------
# One URL per page
#
# Netlify resolves /about to about.html on its own, so both forms work. Two
# working URLs for one page splits its ranking, so the .html form redirects
# permanently to the clean one — which is also the form the canonical tags
# and sitemap.xml name, and the form Webflow would serve if the site ever
# moves there. 301, not 302: only a permanent redirect passes ranking.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/journal.html"
  to = "/journal"
  status = 301
  force = true

[[redirects]]
  from = "/connect.html"
  to = "/connect"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # No referrer leakage to third parties, but same-origin analytics still work.
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    # The site loads its own assets and self-hosted fonts only. The one
    # third-party connection is the YouTube player, and that is a facade:
    # nothing is requested from YouTube until a visitor presses Watch, so
    # youtube-nocookie.com is allowed as a frame but nothing else is.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Fingerprint-free filenames, so a long cache would strand a stale stylesheet
# on a returning visitor. One hour is long enough to help and short enough to
# fix a mistake.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Fonts and images do not change without changing name in practice.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The brand guidelines are an internal reference. The page already carries a
# noindex meta tag; this says the same thing in a header, which crawlers that
# never parse the HTML will still honour.
[[headers]]
  for = "/brand/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
